<span style="font-size: medium;">Welcome to the Password Generator! Kindly click the Generate Password to generate a word, and put in the giveaways. If the password is wrong, try other password. Thank you!</span><br />
<br />
<blockquote><h2>Password: <span id="password"></span></h2>
<button class="button-15" id="show_password" onclick="gen()">Generate Password</button></blockquote>

<script>
	let passwords = ['stines', 'blassuing', 'kun', 'behesidutte', 'philitzes', 'levex', 'explic'];
  
  function gen() {
   	 let h2pw = document.getElementById('password');
     h2pw.innerText = passwords[getRandomInt(0, passwords.length-1)];
  }
  
  function getRandomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
</script>
